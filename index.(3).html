<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qarnon AI™ - الواجهة الذكية</title>
    <style>
        :root {
            --primary-glow: #00d2ff;
            --secondary-glow: #9d50bb;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-color: #e0e0e0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body {
            background-color: #000; color: var(--text-color); height: 100vh;
            display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative;
        }

        .neon-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; filter: blur(100px); opacity: 0.6; }
        .blob { position: absolute; width: 400px; height: 400px; border-radius: 50%; animation: move 20s infinite alternate; }
        .blob-1 { background: var(--primary-glow); top: -100px; left: -100px; }
        .blob-2 { background: var(--secondary-glow); bottom: -100px; right: -100px; animation-delay: -5s; }
        @keyframes move { from { transform: translate(0, 0); } to { transform: translate(100px, 100px); } }

        .glass-card {
            position: relative; z-index: 1; width: 90%; max-width: 800px; padding: 40px;
            background: var(--glass-bg); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border); border-radius: 24px; display: flex; flex-direction: column; gap: 25px;
        }

        header { text-align: center; }
        h1 { font-size: 2.5rem; color: #fff; text-shadow: 0 0 10px var(--primary-glow); margin-bottom: 10px; }

        textarea {
            width: 100%; height: 120px; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--glass-border);
            border-radius: 15px; padding: 15px; color: #fff; font-size: 1.1rem; resize: none; outline: none;
        }

        button {
            padding: 15px 40px; font-size: 1.2rem; font-weight: bold; color: #fff; background: transparent;
            border: 2px solid var(--primary-glow); border-radius: 50px; cursor: pointer; transition: 0.3s;
            animation: pulse 2s infinite;
        }
        button:hover { background: var(--primary-glow); color: #000; box-shadow: 0 0 30px var(--primary-glow); }
        button:disabled { opacity: 0.5; cursor: not-allowed; animation: none; }

        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(0, 210, 255, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(0, 210, 255, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 210, 255, 0); } }

        .response-container {
            min-height: 150px; max-height: 300px; overflow-y: auto; background: rgba(0, 0, 0, 0.2);
            border-radius: 15px; padding: 20px; border: 1px solid var(--glass-border); line-height: 1.6;
        }

        .error-box { color: #ff4d4d; font-size: 0.9rem; margin-top: 10px; display: none; }
        .loading-text { color: var(--secondary-glow); animation: blink 1.5s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
        footer { text-align: center; font-size: 0.8rem; opacity: 0.5; }
    </style>
</head>
<body>
    <div class="neon-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="glass-card">
        <header>
            <h1>Qarnon AI™</h1>
            <p>مستقبلك يبدأ هنا مع الذكاء الاصطناعي</p>
        </header>

        <textarea id="userInput" placeholder="اكتب سؤالك هنا..."></textarea>

        <div style="display:flex; justify-content:center;">
            <button id="runBtn" onclick="processAI()">تشغيل المعالجة الذكية</button>
        </div>

        <div id="responseArea" class="response-container">في انتظار أوامرك...</div>
        <div id="errorArea" class="error-box"></div>

        <footer>&copy; 2024 Qarnon AI™ | جميع الحقوق محفوظة</footer>
    </div>

    <script>
        const modelUrl = 'https://api-inference.huggingface.co/models/mohammedqarnuon/MLQarnonai';
        const token = 'Bearer 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';

        async function processAI() {
            const input = document.getElementById('userInput').value;
            const area = document.getElementById('responseArea');
            const errArea = document.getElementById('errorArea');
            const btn = document.getElementById('runBtn');

            if (!input.trim()) return;

            area.innerHTML = '<span class="loading-text">جاري المعالجة...</span>';
            errArea.style.display = "none";
            btn.disabled = true;

            const prompt = `<bos><start_of_turn>user\nأنت مساعد ذكي مغربي بروفيسيونال تابع لمنصة Qarnon AI™ تجيب باحترافية وذكاء.\nالمطلوب: ${input}<end_of_turn>\n<start_of_turn>model\n`;

            try {
                const response = await fetch(modelUrl, {
                    method: 'POST',
                    headers: { 'Authorization': token, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ inputs: prompt })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    if (errorData.error && errorData.error.includes("loading")) {
                        area.innerText = "⚠️ الموديل يستيقظ الآن.. يرجى الانتظار 30 ثانية ثم حاول مجدداً.";
                    } else {
                        throw new Error(errorData.error || "خطأ في السيرفر");
                    }
                } else {
                    const result = await response.json();
                    let text = Array.isArray(result) ? result[0].generated_text : result.generated_text;
                    text = text.split('<start_of_turn>model\n').pop().replace('<end_of_turn>', '').trim();
                    typeEffect(text, area);
                }
            } catch (e) {
                area.innerText = "فشل في الاتصال.";
                errArea.innerHTML = `⚠️ <b>تنبيه هام:</b> يبدو أن متصفحك يمنع الطلب (CORS Error).<br>
                    <b>الحل:</b> إذا كنت تستخدم Acode، تأكد من تشغيل الملف عبر خادم محلي (Local Server) أو رفعه على استضافة (مثل GitHub Pages).<br>
                    <i>السبب التقني: ${e.message}</i>`;
                errArea.style.display = "block";
            } finally {
                btn.disabled = false;
            }
        }

        function typeEffect(text, el) {
            el.innerText = ""; let i = 0;
            const t = setInterval(() => {
                if (i < text.length) { el.innerText += text.charAt(i); i++; el.scrollTop = el.scrollHeight; }
                else clearInterval(t);
            }, 30);
        }
    </script>
</body>
</html>
